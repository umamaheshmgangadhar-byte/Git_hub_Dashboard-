name: Collect GitHub Actions Metrics

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/dashboard.json"

permissions:
  contents: write

concurrency:
  group: actions-dashboard-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_ORGANIZATION: ${{ vars.GITHUB_ORGANIZATION }}
      GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      GITHUB_API_URL: https://api.github.com
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Collect organization metrics
        run: python collector/collect.py

      - name: Commit generated dashboard data
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "dashboard.json is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "chore: refresh dashboard data"
          git push
